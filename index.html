<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wald Uhr</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #ffffff;
    background: url("https://images.pexels.com/photos/459225/pexels-photo-459225.jpeg") center/cover no-repeat fixed;
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.35), rgba(0,0,0,0.75));
    z-index: 0;
  }
  .clock {
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .time {
    font-size: 96px;
    font-weight: 600;
    letter-spacing: 4px;
  }
  .date {
    margin-top: 12px;
    font-size: 24px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="clock">
  <div id="time" class="time"></div>
  <div id="date" class="date"></div>
</div>

<script>
function updateClock() {
  const now = new Date();
  const timeEl = document.getElementById("time");
  const dateEl = document.getElementById("date");

  timeEl.textContent = now.toLocaleTimeString("de-DE", {
    hour: "2-digit",
    minute: "2-digit"
  });

  dateEl.textContent = now.toLocaleDateString("de-DE", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
